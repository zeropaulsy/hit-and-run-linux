# Custom material shaders (see README.md). Lines are "pattern = file[, file...]": the pattern may use * and ?, files
# are relative to this folder. Material rules win over file rules, file rules over type rules; within each section the
# first match wins.
# Remove the '#' in front of a line to use it. Changes take effect while the game runs.

[types]
# by the shader type the art names: simple (almost everything), spheremap and environment (car paint), or a mod's own
# per-pixel lighting for everything lit (characters, cars, props), all three lines:
#simple = materials/pixellit.glsl
#spheremap = materials/pixellit.glsl
#environment = materials/pixellit.glsl
#spheremap = materials/carpaint.glsl
#environment = materials/carpaint.glsl
#simple = materials/toon.glsl
#simple = materials/normals.glsl

[files]
# by the art file the material comes from (SHAR_MATERIAL_LOG=1 prints them too). Several files, comma-separated, draw
# the material once with each: here flat colours, then black outlines (use materials/standard.glsl for the first
# to keep the game's own shading)
#*chars/* = materials/flat.glsl
#*chars/* = materials/flat.glsl, materials/outline.glsl
*chars/* = materials/softlit.glsl
# the same, written for Vulkan (Vulkan renderer only; it comes second here, so the line above wins while it is on)
#*chars/* = materials/vulkan/softlit.spv

[materials]
# by material name, from the art (SHAR_MATERIAL_LOG=1 prints them as they are drawn)
#*_vChrome_m = materials/carpaint.glsl
