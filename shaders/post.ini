# Post-processing passes (see README.md). Shader files are relative to this folder; passes run top to bottom.
# [scene] passes see the 3D world before the HUD and menus are drawn on top; [final] passes see the whole frame.
# Remove the '#' in front of a line to turn a pass on. Changes take effect while the game runs.

[scene]
# ambient occlusion: three passes, in this order (darker corners, objects grounded)
post/ssao.glsl
post/ssao_blur_h.glsl
post/ssao_blur_v.glsl
# bloom: four passes, in this order
#post/bloom_bright.glsl
#post/bloom_blur_h.glsl
#post/bloom_blur_v.glsl
#post/bloom_add.glsl
#post/fxaa.glsl
# tone mapping and colour grading, in this order (each optional; lut.glsl names its LUT image at its top)
post/tonemap.glsl
#post/grade.glsl
#post/lut.glsl
#post/sharpen.glsl
#post/vignette.glsl
#post/show_depth.glsl

[final]
#post/crt.glsl
